name: Build MX King Smart LED APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name '*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "File ZIP belum diupload ke repositori!"
            exit 1
          fi
          echo "Mengekstrak $ZIP_FILE ..."
          rm -rf _proj
          mkdir -p _proj
          unzip -o "$ZIP_FILE" -d _proj
          PROJ_DIR=$(dirname "$(find _proj -maxdepth 3 -name 'settings.gradle' | head -n 1)")
          echo "Build di folder: $PROJ_DIR"
          cd "$PROJ_DIR"
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/MXKing_Smart_LED_V8.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MXKing_Smart_LED_V8_APK
          path: MXKing_Smart_LED_V8.apk
